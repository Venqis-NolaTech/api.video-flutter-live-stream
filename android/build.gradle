group 'video.api.flutter.livestream'
version '1.0-SNAPSHOT'

buildscript {
    ext {
        kotlin_version = '2.1.10'
        // Matches Maven Central latest `streampack-core` + `streampack-rtmp`
        // (verified 2026-05: maven-metadata `<release>` = 3.1.2). Keep both deps on the same value.
        streamPackVersion = '3.1.2'
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    namespace "video.api.flutter.livestream"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    implementation "io.github.thibaultbee.streampack:streampack-core:$streamPackVersion"
    implementation "io.github.thibaultbee.streampack:streampack-rtmp:$streamPackVersion"
}
